services:
  - type: web
    name: ergocare-backend
    runtime: python
    rootDir: ergo_ml_backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_TOKEN
        value: ec-admin-cp04-2026
      - key: AUDIO_UPLOAD_DIR
        value: /opt/render/project/src/uploads/audio
      - key: ALLOWED_ORIGINS
        sync: false   # Set this in Render dashboard to your Vercel URL e.g. https://ergocare-ai.vercel.app
